
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | LearnHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">

                    <h3 class="fw-bold mb-2">Forgot Password?</h3>
                    <p class="text-muted mb-4">
                        Enter your registered email and choose a new password.
                    </p>

                    <form id="forgotPasswordForm">

                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" id="resetEmail"
                                class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">New Password</label>
                            <input type="password" id="resetPassword"
                                class="form-control" minlength="8" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Confirm New Password</label>
                            <input type="password" id="confirmResetPassword"
                                class="form-control" minlength="8" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Reset Password
                        </button>

                    </form>

                    <div id="resetMessage" class="mt-3"></div>

                    <div class="text-center mt-3">
                        <a href="login.html">Back to Login</a>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="assets/js/script.js"></script>

</body>
</html>
