
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard | LearnHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #6c3ce9;">
    <div class="container">
        <a class="navbar-brand fw-bold" href="dashboard.html">LearnHub</a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#studentNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="studentNavbar">
            <ul class="navbar-nav ms-auto align-items-lg-center">
                <li class="nav-item">
                    <a class="nav-link active" href="dashboard.html">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="courses.html">Available Courses</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="my-courses.html">My Courses</a>
                </li>
                <li class="nav-item ms-lg-3">
                    <button class="btn btn-outline-light btn-sm" id="logoutBtn">
                        Logout
                    </button>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-5">

    <div class="mb-4">
        <h2>Welcome, <span id="studentName">Student</span>!</h2>
        <p class="text-muted">Here's your learning overview.</p>
        <p id="studentEmail" class="text-muted"></p>
    </div>

    <div class="row g-4">

        <div class="col-md-6">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body p-4">
                    <h6 class="text-muted">Available Courses</h6>
                    <h2 id="totalCourses">0</h2>
                    <a href="courses.html" class="btn btn-primary mt-3">
                        Explore Courses
                    </a>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body p-4">
                    <h6 class="text-muted">My Enrolled Courses</h6>
                    <h2 id="totalEnrollments">0</h2>
                    <a href="my-courses.html" class="btn btn-outline-primary mt-3">
                        View My Courses
                    </a>
                </div>
            </div>
        </div>

    </div>

    <div class="mt-5">
        <h4>Start Learning</h4>
        <p class="text-muted">
            Explore available courses and enroll to begin your learning journey.
        </p>
        <a href="courses.html" class="btn btn-primary">
            Browse Courses
        </a>
    </div>

    <div id="studentMessage" class="mt-3"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/script.js"></script>

</body>
</html>
