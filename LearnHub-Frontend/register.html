
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | LearnHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="auth-container">
    <div class="auth-card">

        <div class="brand">
            <div class="brand-icon">L</div>
            <h3>LearnHub</h3>
            <p>Start Your Learning Journey</p>
        </div>

        <h4>Create Account</h4>
        <p class="subtitle">Register as a student</p>

        <form id="registerForm">

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control"
                       id="registerName" placeholder="Enter your name"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control"
                       id="registerEmail" placeholder="Enter your email"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control"
                       id="registerPassword" placeholder="Minimum 8 characters"
                       minlength="8" required>
            </div>

            <div id="registerMessage" class="message"></div>

            <button type="submit" class="btn btn-primary w-100">
                Create Account
            </button>

        </form>

        <p class="auth-footer">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>
</div>

<script src="assets/js/script.js"></script>
</body>
</html>
