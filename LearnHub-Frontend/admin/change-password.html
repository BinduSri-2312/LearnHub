
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | LearnHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<nav class="navbar navbar-dark" style="background-color: #6c3ce9;">
    <div class="container">
        <a class="navbar-brand fw-bold" href="dashboard.html">
            LearnHub Admin
        </a>
        <a href="dashboard.html" class="btn btn-outline-light btn-sm">
            Back to Dashboard
        </a>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">

                    <h3 class="fw-bold mb-2">Change Password</h3>
                    <p class="text-muted mb-4">
                        Enter your current password and choose a new one.
                    </p>

                    <form id="changePasswordForm">

                        <div class="mb-3">
                            <label class="form-label">Current Password</label>
                            <input
                                type="password"
                                id="currentPassword"
                                class="form-control"
                                required
                                autocomplete="current-password">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">New Password</label>
                            <input
                                type="password"
                                id="newPassword"
                                class="form-control"
                                minlength="12"
                                required
                                autocomplete="new-password">
                            <small class="text-muted">
                                Use at least 12 characters.
                            </small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Confirm New Password</label>
                            <input
                                type="password"
                                id="confirmPassword"
                                class="form-control"
                                minlength="12"
                                required
                                autocomplete="new-password">
                        </div>

                        <button type="submit" class="btn btn-primary w-100" id="changePasswordBtn">
                            Change Password
                        </button>

                    </form>

                    <div id="passwordMessage" class="mt-3"></div>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="../assets/js/script.js"></script>

</body>
</html>
