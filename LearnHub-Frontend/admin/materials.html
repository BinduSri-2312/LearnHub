
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Materials | LearnHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #6c3ce9;">
    <div class="container">
        <a class="navbar-brand fw-bold" href="dashboard.html">LearnHub Admin</a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#adminNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="adminNavbar">
            <ul class="navbar-nav ms-auto align-items-lg-center">
                <li class="nav-item">
                    <a class="nav-link" href="dashboard.html">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="courses.html">Courses</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="students.html">Students</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="materials.html">Materials</a>
                </li>
                <li class="nav-item ms-lg-3">
                    <button class="btn btn-outline-light btn-sm" id="logoutBtn">
                        Logout
                    </button>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-5">

    <div class="mb-4">
        <h2>Course Materials</h2>
        <p class="text-muted">
            Upload learning materials for your courses.
        </p>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">

            <form id="materialForm">

                <div class="mb-3">
                    <label for="materialCourse" class="form-label">
                        Select Course
                    </label>
                    <select id="materialCourse" class="form-select" required>
                        <option value="">Loading courses...</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="materialTitle" class="form-label">
                        Material Title
                    </label>
                    <input type="text" id="materialTitle"
                           class="form-control"
                           placeholder="Enter material title"
                           maxlength="150" required>
                </div>

                <div class="mb-3">
                    <label for="materialFile" class="form-label">
                        Select File
                    </label>
                    <input type="file" id="materialFile"
                           class="form-control"
                           accept=".pdf,.doc,.docx,.ppt,.pptx,.txt"
                           required>
                    <small class="text-muted">
                        Allowed formats: PDF, DOC, DOCX, PPT, PPTX, TXT
                    </small>
                </div>

                <button type="submit" class="btn btn-primary" id="uploadMaterialBtn">
                    Upload Material
                </button>

            </form>

            <div id="materialMessage" class="mt-3"></div>

        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/script.js"></script>

</body>
</html>
