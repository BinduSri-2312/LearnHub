
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Students | LearnHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark" style="background: #5b3cc4;">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="dashboard.html">LearnHub Admin</a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#adminNavbar"
                aria-controls="adminNavbar" aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="adminNavbar">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">
                <li class="nav-item">
                    <a class="nav-link" href="dashboard.html">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="courses.html">Courses</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="students.html">Students</a>
                </li>
                <li class="nav-item">
                    <button class="btn btn-light btn-sm px-3" id="logoutBtn">Logout</button>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">

    <div class="mb-4">
        <h2 class="fw-bold mb-1">Manage Students</h2>
        <p class="text-muted mb-0">View and manage registered students.</p>
    </div>

    <div id="studentMessage" class="mb-3" role="alert"></div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">

            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
                <h5 class="fw-bold mb-0">Registered Students</h5>

                <input
                    type="search"
                    id="studentSearch"
                    class="form-control"
                    style="max-width: 300px;"
                    placeholder="Search by name or email..."
                >
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="text-muted">Total Students</span>
                <span class="badge text-bg-light" id="studentCount">0 Students</span>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Student Name</th>
                            <th>Email</th>
                            <th>Enrolled Courses</th>
                            <th>Registered On</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="studentsTableBody">
                        <tr>
                            <td colspan="6" class="text-center text-muted py-4">
                                Loading students...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/script.js"></script>
</body>
</html>
